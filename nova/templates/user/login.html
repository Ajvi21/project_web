{% extends "nova/base.html" %}

{% block title %}Nova Build | Kyçu{% endblock %}

{% block content %}
<main class="section-padding bg-light-custom" style="min-height: 70vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="content-panel">
          <h2 class="text-center mb-4">Kyçu</h2>

          {% if form.errors %}
            <div class="alert alert-danger">Përdoruesi ose fjalëkalimi nuk është i saktë.</div>
          {% endif %}

          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label for="{{ form.username.id_for_label }}" class="form-label">Përdoruesi</label>
              <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
              <label for="{{ form.password.id_for_label }}" class="form-label">Fjalëkalimi</label>
              <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" class="form-control form-control-lg" required>
              <div class="form-text">
                <a href="{% url 'password_reset' %}" class="text-decoration-none">Harruat fjalëkalimin?</a>
              </div>
            </div>
            <button type="submit" class="btn btn-gold w-100 btn-lg">Hyr</button>
          </form>

          <div class="mt-4 text-center">
            <p class="mb-0">Nuk ke llogari?</p>
            <a href="{% url 'register' %}" class="btn btn-outline-secondary mt-2">Krijo llogari</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
