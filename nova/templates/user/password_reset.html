{% extends "nova/base.html" %}

{% block title %}Nova Build | Rivendos fjalëkalimin{% endblock %}

{% block content %}
<main class="section-padding bg-light-custom" style="min-height: 70vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="content-panel">
          <h2 class="text-center mb-4">Rivendos fjalëkalimin</h2>
          {% if form.errors %}
            <div class="alert alert-danger">Ju lutemi shkruani një email të vlefshëm.</div>
          {% endif %}
          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-4">
              <label for="{{ form.email.id_for_label }}" class="form-label">Email-i i llogarisë</label>
              <input type="email" name="email" id="{{ form.email.id_for_label }}" class="form-control form-control-lg" required autofocus>
            </div>
            <button type="submit" class="btn btn-gold w-100 btn-lg">Dërgo lidhjen e rivendosjes</button>
          </form>
          <div class="mt-4 text-center">
            <a href="{% url 'login' %}" class="text-decoration-none">← Kthehu te kyçja</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
