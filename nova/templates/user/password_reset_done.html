{% extends "nova/base.html" %}

{% block title %}Nova Build | Email-i u dërgua{% endblock %}

{% block content %}
<main class="section-padding bg-light-custom" style="min-height: 60vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="content-panel text-center">
          <h2 class="mb-3">Email-i për rivendosjen u dërgua</h2>
          <p class="lead">Të kemi dërguar udhëzime për të vendosur një fjalëkalim të ri. Nëse nuk e gjen email-in, kontrollo dosjen e spam-it.</p>
          <a href="{% url 'login' %}" class="btn btn-gold mt-3">Kthehu te kyçja</a>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
